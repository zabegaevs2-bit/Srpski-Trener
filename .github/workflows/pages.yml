name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache generated audio
        uses: actions/cache@v4
        with:
          path: audio/clips
          key: clips-${{ hashFiles('data/course.json') }}
          restore-keys: clips-
      - name: Generate audio
        run: |
          pip install edge-tts
          python tools/make_audio.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html style.css manifest.webmanifest icon-180.png icon-512.png js data audio _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
